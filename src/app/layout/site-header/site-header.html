<header class="site-header">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="site-header__bar">
    <a routerLink="/" class="logo" (click)="close()">
      <span class="logo__mark">{{ site.shortName }}</span>
      <span class="logo__name">{{ site.name }}</span>
    </a>

    <nav id="mobile-nav" class="site-nav" [class.is-open]="menuOpen()" aria-label="Primary">
      <ul>
        @for (link of links; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: link.path === '/' }"
              (click)="close()"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="site-header__actions">
      <button
        type="button"
        class="icon-btn"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        @if (theme.theme() === 'dark') {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="5" fill="currentColor" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              stroke="currentColor"
              stroke-width="1.8"
              fill="none"
              stroke-linecap="round"
            />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M18 12.5A6.5 6.5 0 1 1 11.5 6 5 5 0 0 0 18 12.5Z"
              fill="currentColor"
            />
          </svg>
        }
      </button>

      <button
        type="button"
        class="icon-btn burger"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-nav"
        aria-label="Toggle menu"
      >
        @if (menuOpen()) {
          <span aria-hidden="true">✕</span>
        } @else {
          <span aria-hidden="true">☰</span>
        }
      </button>
    </div>
  </div>
</header>
